# Releases the Android app.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# ...builds the web app, packages it into the Capacitor shell, signs the result
# and attaches an installable APK (plus an AAB, for Play) to a GitHub Release.
#
# Signing: set the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign
# with a stable key. Without them the workflow still produces an installable
# build, signed with a keystore generated for that run — fine for trying it out,
# but Android refuses to *upgrade* an app whose signature changed, so anyone
# updating has to uninstall first. The release notes say so.
name: IdeaBRD Android Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version name for a build made without a tag
        required: false
        default: 0.0.0-dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make sure the SDK has what the build needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Work out what this release is called
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${{ inputs.version }}"
          fi
          echo "name=$name" >> $GITHUB_OUTPUT
          # Monotonic and never reused: Play and the installer both refuse a
          # build whose version code is not higher than the installed one.
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Run the shared-core tests
        working-directory: android
        run: ./gradlew :core:test

      - name: Build the web app the shell loads
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap copy android

      - name: Prepare the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE:-}" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "stable=true" >> $GITHUB_OUTPUT
          else
            # No key configured: make one for this run so the artifact is at
            # least installable. Announced in the release notes, because an
            # unstable signature is a real limitation, not a detail.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -alias ideabrd -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ephemeral -keypass ephemeral \
              -dname "CN=IdeaBRD, OU=Unsigned build, O=IdeaBRD, C=GB"
            echo "stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Build the release APK and bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ephemeral' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ideabrd' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ephemeral' }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          IDEABRD_GITHUB_CLIENT_ID: ${{ secrets.IDEABRD_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Name the artifacts after the version
        id: artifacts
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ideabrd-$version.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/ideabrd-$version.aab"
          ls -la dist

      - name: Keep the build, tag or not
        uses: actions/upload-artifact@v4
        with:
          name: ideabrd-android-${{ steps.version.outputs.name }}
          path: dist/*

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.signing.outputs.stable }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "IdeaBRD for Android — the board, read and written straight from git."
            echo
            echo "Install \`ideabrd-$VERSION.apk\` on the device. On first run it signs in"
            echo "with the GitHub device flow and clones the board repo you name; after that"
            echo "the app works with no server at all, and syncing is a commit and a push."
            echo
            if [ "$STABLE" != "true" ]; then
              echo "> **Signed with a throwaway key.** No signing secrets are configured for"
              echo "> this repository, so every release is signed differently and Android will"
              echo "> refuse to install this over an earlier one — uninstall first. Set"
              echo "> \`ANDROID_KEYSTORE_BASE64\` and friends to get upgradeable builds."
              echo
            fi
            echo "Built from ${{ github.sha }}."
          } > "$notes"
          gh release create "${{ github.ref_name }}" dist/* \
            --title "IdeaBRD Android $VERSION" \
            --notes-file "$notes"
