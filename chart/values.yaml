# IdeaBRD chart values. Mirrors the ratetheslopes (rts-helm) layout:
# External Secrets Operator + OpenBao for secrets, CNPG bootstrapped from
# ESO-provided credentials, a single Traefik ingress, everything values-driven.

# Ingress is a single Traefik-class Ingress on frontend.fqdn: /api -> backend, / -> frontend.
ingress:
  className: traefik
  tlsSecretName: ideabrd-tls
  certClusterIssuer: letsencrypt-cloudflare
  externalDnsTarget: "75c20a42-2dd1-4297-8a51-3aefbcb3f004.cfargotunnel.com"
  # Attach a Traefik security-headers Middleware (HSTS, nosniff, frame-deny, etc.).
  # No CSP/no-store, so Google Fonts, avatars and custom logo URLs keep working.
  securityHeaders: true

frontend:
  name: ideabrd-frontend
  group: ideabrd
  fqdn: ideabrd.nickknows.net      # <-- set your real hostname
  path: /
  replicaCount: 1
  container:
    image: docker.io/ncging/ideabrd-frontend:2026-08-29.15.24
    imagePullPolicy: Always
    port: 80
    cpu: "250m"
    memory: "128Mi"

backend:
  name: ideabrd-backend
  group: ideabrd
  replicaCount: 1
  # OpenBao path holding session_secret, google_client_id, google_client_secret, github_token
  secretPath: ideabrd/backend
  cookieSecure: true
  # Enable GitHub login. Requires client_id + client_secret in OpenBao at
  # githubSecretPath (else the ExternalSecret sync fails).
  githubOAuth: true
  # OpenBao path holding the GitHub OAuth app credentials (client_id, client_secret)
  githubSecretPath: ideabrd/github
  # Receive GitHub webhooks at /api/webhooks/github, so an issue closed on
  # GitHub reaches an open board instead of waiting to be noticed. Requires
  # webhook_secret in OpenBao at secretPath, matching the secret configured on
  # the GitHub webhook itself. Without it the endpoint refuses every request.
  webhooks: true
  container:
    image: docker.io/ncging/ideabrd-backend:2026-08-25.13.05
    imagePullPolicy: Always
    port: 8000
    cpu: "500m"
    memory: "512Mi"

db:
  name: ideabrd-db
  group: ideabrd
  # Single instance: this is a demo board, not an HA workload. Raise for real redundancy.
  instances: 1
  size: 10Gi
  # OpenBao path holding the superuser + app-user credentials
  # Bounds added 2026-08-18. Observed peak working set was 60Mi
  # (postgres runs shared_buffers=128MB + work_mem=4MB), so 256Mi requests
  # sits above real usage and the 1Gi limit leaves ~10x headroom for vacuum,
  # index builds and query bursts. CPU limit is loose on purpose: throttling
  # a database is worse than the overcommit it prevents.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  secretPath: ideabrd/db
  # Backups. The cluster is a single instance with no replica, so its volume is
  # the only copy of anything not yet published to git.
  backup:
    # Nightly pg_dump to a PVC. Self-contained: no cloud account, no extra
    # credentials, and restorable with pg_restore anywhere.
    enabled: true
    schedule: "0 2 * * *"
    keepDays: 14
    size: 10Gi
    storageClassName: ""
    # pg_dump only needs to be no older than the server, so a newer client is
    # the safe default against whichever Postgres the operator runs.
    image: postgres:17-alpine
    # Continuous WAL archiving to S3-compatible storage, for point-in-time
    # recovery. Needs access_key_id + secret_access_key in OpenBao at
    # secretPath, and a bucket that already exists.
    objectStore:
      enabled: false
      destinationPath: ""          # e.g. s3://backups/ideabrd
      endpointURL: ""              # e.g. https://minio.example.com (blank = AWS)
      secretPath: ideabrd/backup
      # CNPG cron takes six fields, seconds first.
      schedule: "0 0 2 * * *"
      retentionPolicy: "30d"
  app:
    name: ideabrd            # database name
    owner: ideabrd           # owning role (must equal the app-user username)
  superuser:
    userKey: dbsu
    passwordKey: dbsupassw
  appuser:
    userKey: dbuser
    passwordKey: dbpassw

# Run `alembic upgrade head` as a backend initContainer on every rollout.
migrations:
  enabled: true
