server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lightweight health endpoint for k8s probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Cache hashed, immutable build assets aggressively.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Android App Links. Android fetches this to decide whether the app may
    # claim links on this host, and it must come back as JSON: falling through
    # to the SPA below would hand Android an HTML page, which fails
    # verification while looking like the file is there.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so client routing works.
    # (/api is routed to the backend by the Kubernetes Ingress, not here.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
